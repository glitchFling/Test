name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest  # Works on windows-latest too!
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # DELETE THE CACHE LINE BELOW
          # cache: 'pip' 


      # No chmod needed! We call the interpreter directly.
      - name: Run CI Validation
        run: python ci_check.py
