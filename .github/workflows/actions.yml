name: Python CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Locate and Execute CI
        run: |
          # Find the script path automatically
          TARGET=$(find . -name "ci_check.py" -print -quit)
          if [ -z "$TARGET" ]; then
            echo "❌ Error: ci_check.py not found!"
            exit 1
          fi
          # Run via interpreter to bypass chmod
          python "$TARGET"
