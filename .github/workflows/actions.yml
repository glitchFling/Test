name: Python CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Find and Run CI
        run: |
          # Use 'find' to locate the script and 'python' to run it (No chmod!)
          SCRIPT_PATH=$(find . -name "ci_check.py" -print -quit)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ Error: Could not find ci_check.py anywhere in the repo!"
            exit 1
          fi
          echo "Found script at: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

