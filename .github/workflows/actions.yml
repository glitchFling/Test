name: Python CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run CI and Report Features
        # No chmod needed, works on the whole repo
        run: |
          python -c "import glob, subprocess; [subprocess.run(['python', f], check=True) for f in glob.glob('**/ci_check.py', recursive=True)]"
