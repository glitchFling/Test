name: Node JS CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Node CI
        run: |
          # Find the actual path to the file
          TARGET=$(find . -name "ci_check.js" -print -quit)
          
          if [ -z "$TARGET" ]; then
            echo "❌ Error: ci_check.js not found anywhere in the repo!"
            exit 1
          fi
          
          echo "Found script at: $TARGET"
          # Run it via node (Chmod-free!)
          node "$TARGET"
