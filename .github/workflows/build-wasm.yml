name: Build C++ → WASM

on:
  push:
    branches: ["**"]

jobs:
  # JOB 1: The Fast Validator
  validate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_step.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Node Validator
        id: check_step
        run: |
          TARGET=$(find . -name "ci_check.js" -print -quit)
          node "$TARGET"

  # JOB 2: Your Actual Build CI (Depends on validate)
  build-wasm:
    needs: validate
    if: needs.validate.outputs.should_run == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Compile index.cpp
        # This is your exact C++ build command
        run: |
          emcc index.cpp \
            -O3 \
            -fno-exceptions \
            -fno-rtti \
            -s DISABLE_EXCEPTION_CATCHING=1 \
            -s STANDALONE_WASM=1 \
            -nostdlib \
            -nostartfiles \
            -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
            -Wl,--no-entry \
            -o index.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: index-wasm
          path: index.wasm
