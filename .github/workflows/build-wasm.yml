name: Build C++ → WASM

on:
  push:
    branches:
      - "**"

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Run config validator (No-JQ Version)
        run: |
          CONFIG="ci.config.json"
          
          # 1. Existence check
          if [ ! -f "$CONFIG" ]; then echo "❌ $CONFIG missing"; exit 1; fi
          echo "✔ $CONFIG exists"

          # 2. Check for standaloneWasm = true using grep
          # This replaces the failing jq logic
          if grep -q '"standaloneWasm": true' "$CONFIG"; then
            echo "• standaloneWasm is enabled"
            
            # 3. If enabled, check for forbidden flags in the code
            if grep -q '"forbidExitRuntime": true' "$CONFIG"; then
              echo "• forbidExitRuntime is enabled"
              if grep -R --include="*.sh" -nE "EXIT_RUNTIME|--exit-runtime" .; then
                echo "❌ Forbidden flag detected!"
                exit 1
              fi
            fi
          fi
          echo "✔ Validation complete"

      - name: Compile index.cpp
        run: |
          emcc index.cpp \
            -O3 \
            -fno-exceptions \
            -fno-rtti \
            -s DISABLE_EXCEPTION_CATCHING=1 \
            -s STANDALONE_WASM=1 \
            -nostdlib \
            -nostartfiles \
            -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
            -Wl,--no-entry \
            -o index.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: index-wasm
          path: index.wasm
