name: Build C++ → WASM

on:
  push:
    branches:
      - "**"

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    # This environment has emcc pre-installed so you don't have to setup git/sdk
    container: emscripten/emsdk:latest 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run config validator
        run: |
          chmod +x .github/scripts/validate-config.sh
          bash .github/scripts/validate-config.sh

      - name: Compile index.cpp → index.wasm
        run: |
          emcc index.cpp \
            -O3 \
            -fno-exceptions \
            -fno-rtti \
            -s DISABLE_EXCEPTION_CATCHING=1 \
            -s STANDALONE_WASM=1 \
            -nostdlib \
            -nostartfiles \
            -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
            -Wl,--no-entry \
            -o index.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: index-wasm
          path: index.wasm
