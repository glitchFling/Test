name: Build C++ → WASM

on:
  push:
    branches:
      - "**"

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CI config
        run: |
          if [ ! -f "ci.config.json" ]; then
            echo "❌ Error 404: ci.config.json not found"
            exit 1
          fi

          if [ ! -s "ci.config.json" ]; then
            echo "❌ Error 400: ci.config.json is empty"
            exit 1
          fi

          echo "✔ ci.config.json found and non-empty"

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Compile index.cpp → index.wasm
        run: |
          cd emsdk
          source ./emsdk_env.sh
          cd ..
          emcc index.cpp \
            -O3 \
            -fno-exceptions \
            -fno-rtti \
            -s DISABLE_EXCEPTION_CATCHING=1 \
            -s NO_EXIT_RUNTIME=1 \
            -s STANDALONE_WASM \
            -s EXPORTED_FUNCTIONS='["_derive_key","_ct_eq"]' \
            -o index.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: index-wasm
          path: index.wasm
