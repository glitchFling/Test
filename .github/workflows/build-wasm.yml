name: Build C++ → WASM

on:
  push:
    branches:
      - "**"

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Compile index.cpp → index.wasm
        run: |
          cd emsdk
          source ./emsdk_env.sh
          cd ..
          emcc index.cpp \
            -O3 \
            -s EXPORTED_FUNCTIONS='["_derive_key","_ct_eq"]' \
            -s EXPORTED_RUNTIME_METHODS='["cwrap"]' \
            -o index.wasm \
            --no-entry \
            -s STANDALONE_WASM

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: index-wasm
          path: index.wasm
